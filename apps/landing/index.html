<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />
    <title>CoolCo | ¡Los mismos tickets, más seguros!</title>
    <meta
      name="description"
      content="CoolCo es tu plataforma integral para comprar tickets, venderlos a otro Fan y realizar pagos cashless."
    />
    <meta
      name="keywords"
      content="coolco tickets, coolco entradas, coolco ticketing, comprar entradas online argentina, ticketera online argentina, entradas para recitales argentina, comprar entradas recitales buenos aires, entradas conciertos argentina, entradas fiestas electrónicas argentina, tickets fiestas buenos aires, entradas estadio obras, comprar entradas estadio obras buenos aires, pagos cashless, cashless argentina, comprar entradas online"
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="CoolCo" />
    <meta property="og:title" content="CoolCo | ¡Los mismos tickets, más seguros!" />
    <meta
      property="og:description"
      content="CoolCo es tu plataforma integral para comprar tickets, venderlos a otro Fan y realizar pagos cashless."
    />
    <meta property="og:image" content="https://coolco.io/og-image.png" />
    <meta property="og:url" content="https://coolco.io" />
    <link rel="canonical" href="https://coolco.io" />
    <!-- Preload critical background image (LCP): mobile-first, desktop override -->
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/coolco-bg-mobile.webp"
      media="(max-width: 1023px)"
    />
    <link
      rel="preload"
      as="image"
      type="image/webp"
      href="/images/coolco-bg.webp"
      media="(min-width: 1024px)"
    />
    <!-- Preload LCP logo -->
    <link rel="preload" as="image" type="image/svg+xml" href="/logos/CoolCo%20Tickets_white.svg" />
    <!-- Preload critical fonts -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Montserrat-SemiBold-subset.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/Montserrat-Regular-subset.woff2"
      crossorigin
    />
    <script>
      // SPA redirect handler for GitHub Pages
      (function () {
        var params = new URLSearchParams(window.location.search);
        var p = params.get('p');
        if (p) {
          var q = params.get('q');
          var path =
            '/' +
            p.replace(/~and~/g, '&') +
            (q ? '?' + q.replace(/~and~/g, '&') : '') +
            window.location.hash;
          window.history.replaceState(null, null, path);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
